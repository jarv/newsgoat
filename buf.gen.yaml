version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/jarv/newsgoat/internal/grpc/gen
plugins:
  - local: protoc-gen-go
    out: internal/grpc/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/grpc/gen
    opt:
      - paths=source_relative
