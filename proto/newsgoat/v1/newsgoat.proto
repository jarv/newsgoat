syntax = "proto3";

package newsgoat.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/jarv/newsgoat/internal/grpc/gen/newsgoat/v1";

// Feed represents an RSS/Atom feed
message Feed {
  int64 id = 1;
  string url = 2;
  string title = 3;
  string description = 4;
  bool visible = 5;
  google.protobuf.Timestamp last_updated = 6;
  string last_error = 7;
  google.protobuf.Timestamp last_error_time = 8;
  google.protobuf.Timestamp created_at = 9;
  string etag = 10;
  string last_modified = 11;
  int64 cache_control_max_age = 12;
}

// Item represents a feed item/article
message Item {
  int64 id = 1;
  int64 feed_id = 2;
  string guid = 3;
  string title = 4;
  string description = 5;
  string content = 6;
  string link = 7;
  google.protobuf.Timestamp published = 8;
  google.protobuf.Timestamp created_at = 9;
}

// ItemWithReadStatus wraps an Item with its read status
message ItemWithReadStatus {
  Item item = 1;
  bool read = 2;
}

// FeedStats contains statistics about a feed
message FeedStats {
  int64 id = 1;
  string title = 2;
  string url = 3;
  int64 total_items = 4;
  int64 unread_items = 5;
  string last_error = 6;
  google.protobuf.Timestamp last_error_time = 7;
}

// Setting represents a key-value setting
message Setting {
  string key = 1;
  string value = 2;
  google.protobuf.Timestamp updated_at = 3;
}

// LogMessage represents a log entry
message LogMessage {
  int64 id = 1;
  string level = 2;
  string message = 3;
  google.protobuf.Timestamp timestamp = 4;
  string details = 5;
}

// FeedService provides feed and item management
service FeedService {
  // High-level feed operations
  rpc AddFeed(AddFeedRequest) returns (AddFeedResponse);
  rpc AddFeedWithoutFetching(AddFeedWithoutFetchingRequest) returns (AddFeedWithoutFetchingResponse);
  rpc RefreshFeed(RefreshFeedRequest) returns (RefreshFeedResponse);
  rpc RefreshFeedByURL(RefreshFeedByURLRequest) returns (RefreshFeedByURLResponse);
  rpc RefreshAllFeeds(RefreshAllFeedsRequest) returns (RefreshAllFeedsResponse);

  // Feed CRUD operations
  rpc CreateFeed(CreateFeedRequest) returns (CreateFeedResponse);
  rpc GetFeed(GetFeedRequest) returns (GetFeedResponse);
  rpc GetFeedByURL(GetFeedByURLRequest) returns (GetFeedByURLResponse);
  rpc ListFeeds(ListFeedsRequest) returns (ListFeedsResponse);
  rpc ListAllFeeds(ListAllFeedsRequest) returns (ListAllFeedsResponse);
  rpc UpdateFeed(UpdateFeedRequest) returns (UpdateFeedResponse);
  rpc UpdateFeedError(UpdateFeedErrorRequest) returns (UpdateFeedErrorResponse);
  rpc ClearFeedError(ClearFeedErrorRequest) returns (ClearFeedErrorResponse);
  rpc DeleteFeed(DeleteFeedRequest) returns (DeleteFeedResponse);
  rpc HideFeed(HideFeedRequest) returns (HideFeedResponse);
  rpc ShowFeed(ShowFeedRequest) returns (ShowFeedResponse);
  rpc HideFeedByURL(HideFeedByURLRequest) returns (HideFeedByURLResponse);
  rpc ShowFeedByURL(ShowFeedByURLRequest) returns (ShowFeedByURLResponse);
  rpc GetFeedStats(GetFeedStatsRequest) returns (GetFeedStatsResponse);
  rpc SearchFeedsByTitle(SearchFeedsByTitleRequest) returns (SearchFeedsByTitleResponse);
  rpc SearchFeedsGlobally(SearchFeedsGloballyRequest) returns (SearchFeedsGloballyResponse);

  // Item operations
  rpc CreateItem(CreateItemRequest) returns (CreateItemResponse);
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  rpc ListItemsByFeed(ListItemsByFeedRequest) returns (ListItemsByFeedResponse);
  rpc UpsertItem(UpsertItemRequest) returns (UpsertItemResponse);
  rpc UpsertItems(UpsertItemsRequest) returns (UpsertItemsResponse);
  rpc DeleteItemsByFeed(DeleteItemsByFeedRequest) returns (DeleteItemsByFeedResponse);
  rpc GetItemsWithReadStatus(GetItemsWithReadStatusRequest) returns (GetItemsWithReadStatusResponse);
  rpc SearchItemsByTitle(SearchItemsByTitleRequest) returns (SearchItemsByTitleResponse);
  rpc SearchItemsGlobally(SearchItemsGloballyRequest) returns (SearchItemsGloballyResponse);

  // Read status operations
  rpc MarkItemRead(MarkItemReadRequest) returns (MarkItemReadResponse);
  rpc MarkItemUnread(MarkItemUnreadRequest) returns (MarkItemUnreadResponse);
  rpc MarkAllItemsReadInFeed(MarkAllItemsReadInFeedRequest) returns (MarkAllItemsReadInFeedResponse);
  rpc IsItemRead(IsItemReadRequest) returns (IsItemReadResponse);

  // Folder operations
  rpc AddFeedFolder(AddFeedFolderRequest) returns (AddFeedFolderResponse);
  rpc GetFeedFolders(GetFeedFoldersRequest) returns (GetFeedFoldersResponse);
  rpc DeleteFeedFolders(DeleteFeedFoldersRequest) returns (DeleteFeedFoldersResponse);
  rpc GetFolderStats(GetFolderStatsRequest) returns (GetFolderStatsResponse);

  // Log operations
  rpc GetLogMessages(GetLogMessagesRequest) returns (GetLogMessagesResponse);
  rpc GetLogMessage(GetLogMessageRequest) returns (GetLogMessageResponse);
  rpc DeleteAllLogMessages(DeleteAllLogMessagesRequest) returns (DeleteAllLogMessagesResponse);
}

// SettingsService provides settings management
service SettingsService {
  rpc GetSetting(GetSettingRequest) returns (GetSettingResponse);
  rpc SetSetting(SetSettingRequest) returns (SetSettingResponse);
  rpc GetAllSettings(GetAllSettingsRequest) returns (GetAllSettingsResponse);
  rpc DeleteSetting(DeleteSettingRequest) returns (DeleteSettingResponse);
}

// High-level feed operation messages
message AddFeedRequest {
  string url = 1;
}

message AddFeedResponse {
  Feed feed = 1;
}

message AddFeedWithoutFetchingRequest {
  string url = 1;
}

message AddFeedWithoutFetchingResponse {
  Feed feed = 1;
}

message RefreshFeedRequest {
  int64 feed_id = 1;
}

message RefreshFeedResponse {}

message RefreshFeedByURLRequest {
  string url = 1;
}

message RefreshFeedByURLResponse {}

message RefreshAllFeedsRequest {}

message RefreshAllFeedsResponse {}

// Feed CRUD messages
message CreateFeedRequest {
  string url = 1;
  string title = 2;
  string description = 3;
}

message CreateFeedResponse {
  Feed feed = 1;
}

message GetFeedRequest {
  int64 id = 1;
}

message GetFeedResponse {
  Feed feed = 1;
}

message GetFeedByURLRequest {
  string url = 1;
}

message GetFeedByURLResponse {
  Feed feed = 1;
}

message ListFeedsRequest {}

message ListFeedsResponse {
  repeated Feed feeds = 1;
}

message ListAllFeedsRequest {}

message ListAllFeedsResponse {
  repeated Feed feeds = 1;
}

message UpdateFeedRequest {
  int64 id = 1;
  string title = 2;
  string description = 3;
}

message UpdateFeedResponse {
  Feed feed = 1;
}

message UpdateFeedErrorRequest {
  int64 id = 1;
  string error = 2;
}

message UpdateFeedErrorResponse {}

message ClearFeedErrorRequest {
  int64 id = 1;
}

message ClearFeedErrorResponse {}

message DeleteFeedRequest {
  int64 id = 1;
}

message DeleteFeedResponse {}

message HideFeedRequest {
  int64 id = 1;
}

message HideFeedResponse {}

message ShowFeedRequest {
  int64 id = 1;
}

message ShowFeedResponse {}

message HideFeedByURLRequest {
  string url = 1;
}

message HideFeedByURLResponse {}

message ShowFeedByURLRequest {
  string url = 1;
}

message ShowFeedByURLResponse {}

message GetFeedStatsRequest {}

message GetFeedStatsResponse {
  repeated FeedStats stats = 1;
}

message SearchFeedsByTitleRequest {
  string query = 1;
}

message SearchFeedsByTitleResponse {
  repeated FeedStats results = 1;
}

message SearchFeedsGloballyRequest {
  string query = 1;
}

message SearchFeedsGloballyResponse {
  repeated FeedStats results = 1;
}

// Item operation messages
message CreateItemRequest {
  int64 feed_id = 1;
  string guid = 2;
  string title = 3;
  string description = 4;
  string content = 5;
  string link = 6;
  google.protobuf.Timestamp published = 7;
}

message CreateItemResponse {
  Item item = 1;
}

message GetItemRequest {
  int64 id = 1;
}

message GetItemResponse {
  Item item = 1;
}

message ListItemsByFeedRequest {
  int64 feed_id = 1;
}

message ListItemsByFeedResponse {
  repeated Item items = 1;
}

message UpsertItemRequest {
  int64 feed_id = 1;
  string guid = 2;
  string title = 3;
  string description = 4;
  string content = 5;
  string link = 6;
  google.protobuf.Timestamp published = 7;
}

message UpsertItemResponse {
  Item item = 1;
}

message UpsertItemsRequest {
  repeated UpsertItemRequest items = 1;
}

message UpsertItemsResponse {
  repeated Item items = 1;
}

message DeleteItemsByFeedRequest {
  int64 feed_id = 1;
}

message DeleteItemsByFeedResponse {}

message GetItemsWithReadStatusRequest {
  int64 feed_id = 1;
}

message GetItemsWithReadStatusResponse {
  repeated ItemWithReadStatus items = 1;
}

message SearchItemsByTitleRequest {
  int64 feed_id = 1;
  string query = 2;
}

message SearchItemsByTitleResponse {
  repeated ItemWithReadStatus results = 1;
}

message SearchItemsGloballyRequest {
  int64 feed_id = 1;
  string query = 2;
}

message SearchItemsGloballyResponse {
  repeated ItemWithReadStatus results = 1;
}

// Read status messages
message MarkItemReadRequest {
  int64 item_id = 1;
}

message MarkItemReadResponse {}

message MarkItemUnreadRequest {
  int64 item_id = 1;
}

message MarkItemUnreadResponse {}

message MarkAllItemsReadInFeedRequest {
  int64 feed_id = 1;
}

message MarkAllItemsReadInFeedResponse {}

message IsItemReadRequest {
  int64 item_id = 1;
}

message IsItemReadResponse {
  bool read = 1;
}

// Folder messages
message AddFeedFolderRequest {
  int64 feed_id = 1;
  string folder = 2;
}

message AddFeedFolderResponse {}

message GetFeedFoldersRequest {
  int64 feed_id = 1;
}

message GetFeedFoldersResponse {
  repeated string folders = 1;
}

message DeleteFeedFoldersRequest {
  int64 feed_id = 1;
}

message DeleteFeedFoldersResponse {}

message GetFolderStatsRequest {}

message GetFolderStatsResponse {
  repeated FolderStats stats = 1;
}

message FolderStats {
  string name = 1;
  int64 total_items = 2;
  int64 unread_items = 3;
}

// Log messages
message GetLogMessagesRequest {
  int64 limit = 1;
}

message GetLogMessagesResponse {
  repeated LogMessage messages = 1;
}

message GetLogMessageRequest {
  int64 id = 1;
}

message GetLogMessageResponse {
  LogMessage message = 1;
}

message DeleteAllLogMessagesRequest {}

message DeleteAllLogMessagesResponse {}

// Settings messages
message GetSettingRequest {
  string key = 1;
}

message GetSettingResponse {
  Setting setting = 1;
}

message SetSettingRequest {
  string key = 1;
  string value = 2;
}

message SetSettingResponse {}

message GetAllSettingsRequest {}

message GetAllSettingsResponse {
  repeated Setting settings = 1;
}

message DeleteSettingRequest {
  string key = 1;
}

message DeleteSettingResponse {}
